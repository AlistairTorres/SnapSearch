<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small local search interface for a fixed image metadata dataset.">
  <title>Snapshot Search Prototype</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <p class="eyebrow">Search interface prototype</p>
    <h1>Snapshot Search</h1>
    <p class="intro">Filter a small local dataset without an API key or network request.</p>
    <form id="search-form">
      <label for="search-input">Search the dataset</label>
      <div class="search-row">
        <input id="search-input" type="search" placeholder="Try “coast” or “architecture”" autocomplete="off">
        <button type="submit">Search</button>
      </div>
    </form>
    <p id="result-summary" class="summary" role="status" aria-live="polite"></p>
    <section id="results" class="results" aria-label="Search results"></section>
  </main>
</body>
</html>
